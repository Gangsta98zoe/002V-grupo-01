name: OPA Policy Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - '*.tf'
      - 'policies/**'
      - '.github/workflows/opa.yml'

permissions:
  contents: read

jobs:
  opa-policies:
    name: Validate OPA Policies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Conftest
        run: |
          curl -sL https://github.com/open-policy-agent/conftest/releases/download/v0.46.0/conftest_0.46.0_Linux_x86_64.tar.gz | tar xz
          sudo mv conftest /usr/local/bin/
          conftest --version

      - name: "Politica 1 - sin SSH publico (no_public_ssh)"
        run: conftest test -p policies/no_public_ssh.rego *.tf

      - name: "Politica 2 - solo t2.micro (only_t2_micro)"
        if: always()
        run: conftest test -p policies/only_t2_micro.rego *.tf

      - name: "Gate final - todas las politicas"
        if: always()
        run: conftest test -p policies/ *.tf
